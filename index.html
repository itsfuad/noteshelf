<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NoteShelf</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><header><h1>NoteShelf</h1><p>Notes saved in this browser</p></header>
<section class="sidebar"><input id="query" placeholder="Search notes" aria-label="Search notes"><ul id="notes"></ul>
<button id="new">New note</button></section>
<main><input id="title" placeholder="Title" aria-label="Note title"><input id="tags" placeholder="Tags, comma separated" aria-label="Tags"><textarea id="body" placeholder="Write a note..." aria-label="Note body"></textarea><div class="actions"><button id="save">Save</button><button id="remove">Delete</button><button id="export">Export JSON</button></div><p id="message" role="status"></p></main>
</div><script src="src/store.js"></script><script src="src/app.js"></script></body></html>
